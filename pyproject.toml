[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerologix-airline-intelligence"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["pyodbc==5.2.0", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
