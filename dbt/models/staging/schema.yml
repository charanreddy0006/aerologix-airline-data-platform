version: 2
models:
  - name: stg_flight
    description: "Thin typed projection of operational flight events; grain is one FlightId."
    columns:
      - name: flight_id
        description: "Source flight identifier."
        tests: [not_null, unique]
      - name: flight_date
        tests: [not_null]
      - name: flight_status
        tests:
          - accepted_values:
              arguments:
                values: ['SCHEDULED', 'COMPLETED', 'CANCELLED', 'DIVERTED']
  - name: stg_booking
    description: "Thin typed projection of booking events; grain is one BookingId."
    columns:
      - name: booking_id
        tests: [not_null, unique]
      - name: flight_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_flight')
                field: flight_id
      - name: booking_status
        tests:
          - accepted_values:
              arguments:
                values: ['BOOKED', 'TICKETED', 'FLOWN', 'CANCELLED']
